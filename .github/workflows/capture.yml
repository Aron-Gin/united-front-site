name: Captura United Front

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rodar captura
        run: python capture.py
      - name: Commitar data.json
        run: |
          git config user.name "united-front-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Atualiza dados $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
